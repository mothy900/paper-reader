[project]
name = "reader-backend"
version = "0.1.0"
description = "Reader API: PDF parsing and LLM features"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.11.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.47",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
