<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#325e81"/>
      <stop offset="100%" stop-color="#1c384e"/>
    </linearGradient>
    <linearGradient id="sparkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdf6d"/>
      <stop offset="100%" stop-color="#e58f0c"/>
    </linearGradient>
    <filter id="tileShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1" flood-opacity="0.2"/>
    </filter>
    <style>
      .tile-border { stroke: rgba(255, 255, 255, 0.08); }
      @media (prefers-color-scheme: dark) {
        .tile-border { stroke: rgba(255, 255, 255, 0.22); }
      }
    </style>
  </defs>

  <!-- Squircle Base Tile -->
  <rect x="1" y="1" width="30" height="30" rx="6.8" fill="url(#tileGrad)" class="tile-border" stroke-width="1"/>

  <!-- Academic Paper Document -->
  <path d="M 7.5 5.5 H 17.5 L 22.5 10.5 V 24.5 A 2 2 0 0 1 20.5 26.5 H 7.5 A 2 2 0 0 1 5.5 24.5 V 7.5 A 2 2 0 0 1 7.5 5.5 Z"
        fill="#fbf9f5"/>
  <!-- Folded Page Corner -->
  <path d="M 17.5 5.5 L 22.5 10.5 H 19 A 1.5 1.5 0 0 1 17.5 9 Z" fill="#cbdbe7"/>

  <!-- Paper Block Lines (Academic Sections) -->
  <rect x="8.5" y="9.5" width="5.5" height="2" rx="1" fill="#2f5a7a" opacity="0.65"/>
  <rect x="8.5" y="13.5" width="10.5" height="2" rx="1" fill="#2f5a7a" opacity="0.9"/>
  <rect x="8.5" y="17.5" width="6.5" height="2" rx="1" fill="#2f5a7a" opacity="0.9"/>
  <rect x="8.5" y="21.5" width="4.5" height="2" rx="1" fill="#2f5a7a" opacity="0.55"/>

  <!-- Glowing AI Sparkle -->
  <path d="M 23 15 Q 23 21.5 29.5 21.5 Q 23 21.5 23 28 Q 23 21.5 16.5 21.5 Q 23 21.5 23 15 Z"
        fill="url(#sparkGold)"/>

  <!-- Mini Sparkle -->
  <path d="M 25 9.5 Q 25 11 26.5 11 Q 25 11 25 12.5 Q 25 11 23.5 11 Q 25 11 25 9.5 Z"
        fill="#ffe685"/>
</svg>